<!--name attribute help to know what the content entered in blank input-box -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Name attribute</title>
</head>
<body>
    <!--login form-->
    <form action="server">
        <label for="Username">Username</label>
        <input id="Username" type="text" placeholder="Enter Username" name="Username"/>
        <label for="password">password</label>
        <input type="password" placeholder="Enter password" id="password" name="password"/>
        <button>submit</button>
    </form>
    <hr>
    <!--Youtube form-->
    <form action="https://www.youtube.com/results">
        <label for="youtube">youtube search</search></label>
        <input type="text" placeholder="youtube" id="youtube" name="search_query"/>
        <button>search</button>
    </form>
    <hr>
    <!--google form-->
    <form action="https://www.google.com/search">
        <label for="google">google serach</label>
        <input id="google" type="text" placeholder="google" name="q"/>
        <button>submit</button>
    </form>

</body>
</html>
