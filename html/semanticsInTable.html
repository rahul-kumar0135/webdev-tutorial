<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic in Table</title>
</head>
<body>
    <table border="black">           <!--table creation-->
        
        <caption>Food Menu</caption> <!--caption-->
        
        <thead>
            <tr>                         <!--table row-->
                <th>Item</th>            <!--table header-->
                <th>Price</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>samosa</td>          <!--table data-->
                <td>12</td>
            </tr>

            <tr>
                <td>chips</td>
                <td>20</td>
            </tr>

            <tr>
                <td>Rasgula</td>
                <td>15</td>
            </tr>
        </tbody>
   

    </table>
</body>
</html>
