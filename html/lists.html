
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists in HTML</title>
</head>
<body>
<!-- unoredred Lists -->
    <ul>
        <li>Bread</li>
        <li>Samosa</li>
        <li>Jalebi</li>
    </ul>
<!-- ordered lists default type -->
    <ol>
        <li>Bread</li>
        <li>Samosa</li>
        <li>Jalebi</li>
    </ol>

<!-- ordered lists (type casting) -->
    <ol type="A">
        <li>Bread</li>
        <li>Samosa</li>
        <li>Jalebi</li> 
    </ol>

</body>
</html>

<html lang="en"></html>
<ol type="A"> </ol>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
