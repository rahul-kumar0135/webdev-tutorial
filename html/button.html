<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button</title>
</head>
<body>
    <form action="action">
        <!--Classical approach (RECOMMENDED)-->
        <label for="Username"></label>
        Username <input type="text" placeholder="Enter Username" id="Username"/>
        
        <label for="password"></label>
        Password <input type="password" placeholder="Enter password" id="password">
        
        <button>Submit button by default</button>
        <!--RECOMMENDED THESE THREE-->
        <button type="submit">submit</button>
        <button type="reset">reset</button>
        <button type="button">button</button>

        <input type="button" nothing/>
        <input type="submit" />
    </form>
</body>
</html>
